<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dhwgithub 产品发布中心</title>
<meta name="description" content="dhwgithub 独立开发的软件产品发布页：安装包下载、使用说明、用户评论">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='10' width='24' height='16' rx='3' fill='%230969da'/%3E%3Cpath d='M4 12l12-8 12 8-12 7z' fill='%230969da' opacity='.55'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6f8fa; --card:#ffffff; --card-hover:#f9fbfc;
  --border:#d0d7de; --border-soft:#e4e8ed;
  --fg:#1f2328; --fg-muted:#656d76; --fg-subtle:#8c959f;
  --accent:#0969da; --accent-hover:#0a58c2; --accent-soft:#ddf4ff;
  --danger:#cf222e; --danger-soft:#ffebe9;
  --ok:#1a7f37; --ok-soft:#dafbe1;
  --warn:#9a6700; --warn-soft:#fff8c5;
  --chip:#eaeef2; --input:#ffffff;
  --shadow:0 1px 3px rgba(31,35,40,.07),0 6px 18px rgba(31,35,40,.06);
  --shadow-hover:0 2px 8px rgba(31,35,40,.1),0 14px 32px rgba(31,35,40,.12);
}
[data-theme="dark"]{
  --bg:#0d1117; --card:#161b22; --card-hover:#1a2029;
  --border:#30363d; --border-soft:#21262d;
  --fg:#e6edf3; --fg-muted:#8b949e; --fg-subtle:#6e7681;
  --accent:#58a6ff; --accent-hover:#79b8ff; --accent-soft:#0d2d4d;
  --danger:#f85149; --danger-soft:#3d1418;
  --ok:#3fb950; --ok-soft:#12261e;
  --warn:#d29922; --warn-soft:#2d2200;
  --chip:#21262d; --input:#0d1117;
  --shadow:0 0 0 1px rgba(255,255,255,.03),0 6px 18px rgba(0,0,0,.4);
  --shadow-hover:0 0 0 1px rgba(255,255,255,.06),0 14px 32px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;
  transition:background .25s,color .25s;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
.hidden{display:none!important}

/* ---------- header ---------- */
header{border-bottom:1px solid var(--border-soft);background:var(--card);transition:background .25s}
.hd-inner{max-width:1080px;margin:0 auto;padding:16px 24px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer}
.brand svg{width:26px;height:26px}
.brand .t{font-size:17px;font-weight:650;letter-spacing:-.2px}
.brand .t small{color:var(--fg-muted);font-weight:500;margin-left:6px;font-size:12px}
.hd-actions{margin-left:auto;display:flex;gap:8px}
.ibtn{
  background:var(--card);border:1px solid var(--border);color:var(--fg);
  height:36px;padding:0 14px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
  font-size:13.5px;font-weight:500;transition:background .15s,border-color .15s;
}
.ibtn:hover{background:var(--chip)}
.ibtn svg{width:16px;height:16px;fill:currentColor}
.ibtn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.ibtn.primary:hover{background:var(--accent-hover)}
.ibtn.danger{color:var(--danger)}
.ibtn:disabled{opacity:.55;cursor:not-allowed}
[data-theme="light"] .ico-moon{display:block}[data-theme="light"] .ico-sun{display:none}
[data-theme="dark"] .ico-moon{display:none}[data-theme="dark"] .ico-sun{display:block}

/* ---------- hero ---------- */
.hero{padding:44px 0 30px}
.hero h1{font-size:32px;font-weight:700;letter-spacing:-.5px;line-height:1.25}
.hero .sub{color:var(--fg-muted);margin-top:10px;max-width:620px}
.stats{display:flex;gap:26px;margin-top:22px;flex-wrap:wrap}
.stat{display:flex;align-items:baseline;gap:7px;font-size:13px;color:var(--fg-muted)}
.stat b{font-size:19px;font-weight:700;color:var(--fg)}

/* ---------- toolbar ---------- */
.toolbar{
  position:sticky;top:0;z-index:20;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--border-soft);
}
.tb-inner{max-width:1080px;margin:0 auto;padding:12px 24px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{position:relative;flex:1;min-width:200px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;fill:var(--fg-subtle)}
.search input{
  width:100%;padding:9px 14px 9px 34px;font-size:14px;font-family:inherit;
  background:var(--input);color:var(--fg);border:1px solid var(--border);border-radius:8px;outline:none;
  transition:border-color .15s,box-shadow .15s;
}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
select{
  padding:9px 12px;font-size:14px;font-family:inherit;
  background:var(--input);color:var(--fg);border:1px solid var(--border);border-radius:8px;cursor:pointer;outline:none;
}
select:hover{border-color:var(--accent)}

/* ---------- product grid ---------- */
main{padding:26px 0 70px;min-height:55vh}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.pcard{
  display:block;background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:20px;box-shadow:var(--shadow);cursor:pointer;
  transition:transform .18s cubic-bezier(.2,.7,.3,1),box-shadow .18s,border-color .18s;
  position:relative;overflow:hidden;
}
.pcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover);border-color:color-mix(in srgb,var(--accent) 45%,var(--border))}
.pcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);transform:scaleY(0);transition:transform .22s}
.pcard:hover::before{transform:scaleY(1)}
.pc-head{display:flex;gap:14px;align-items:flex-start}
.pc-logo{
  width:46px;height:46px;border-radius:10px;flex-shrink:0;display:grid;place-items:center;
  font-size:19px;font-weight:700;color:#fff;letter-spacing:0;
}
.pc-title{font-size:16.5px;font-weight:650;line-height:1.35}
.pc-ver{font-size:11px;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:999px;margin-left:8px;font-weight:600;vertical-align:2px}
.pc-tag{color:var(--fg-muted);font-size:13px;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc-meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;font-size:12.5px;color:var(--fg-muted)}
.pc-meta span{display:inline-flex;align-items:center;gap:4px}
.pc-meta svg{width:13.5px;height:13.5px;fill:currentColor}
.pc-go{margin-top:14px;font-size:13px;color:var(--accent);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.pcard:hover .pc-go svg{transform:translateX(3px)}
.pc-go svg{width:13px;height:13px;fill:currentColor;transition:transform .2s}

.empty{text-align:center;padding:80px 20px;color:var(--fg-muted)}
.empty svg{width:52px;height:52px;fill:var(--fg-subtle);margin-bottom:14px}

/* ---------- detail ---------- */
.detail{max-width:820px;margin:0 auto;padding:30px 0 80px}
.back{
  display:inline-flex;align-items:center;gap:5px;color:var(--accent);font-weight:600;font-size:14px;
  cursor:pointer;margin-bottom:22px;
}
.back svg{width:15px;height:15px;fill:currentColor}
.back:hover{text-decoration:underline}
.d-head{display:flex;gap:18px;align-items:flex-start}
.d-logo{width:64px;height:64px;border-radius:14px;flex-shrink:0;display:grid;place-items:center;font-size:26px;font-weight:700;color:#fff}
.d-title{font-size:26px;font-weight:700;letter-spacing:-.3px;line-height:1.3}
.d-sub{color:var(--fg-muted);margin-top:5px}
.d-meta{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--fg-muted)}
.d-meta span{display:inline-flex;align-items:center;gap:5px}
.d-meta svg{width:14px;height:14px;fill:currentColor}
.d-links{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.section{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:22px;margin-top:18px;box-shadow:var(--shadow)}
.section h2{font-size:15.5px;font-weight:650;display:flex;align-items:center;gap:8px;margin-bottom:14px}
.section h2 svg{width:17px;height:17px;fill:var(--accent)}
.d-desc{white-space:pre-wrap;color:var(--fg);font-size:14.5px}
.d-desc a{color:var(--accent)}

.frow{
  display:flex;align-items:center;gap:14px;padding:13px 0;
  border-top:1px solid var(--border-soft);
}
.frow:first-of-type{border-top:0;padding-top:2px}
.frow .fi{flex:1;min-width:0}
.frow .fn{font-weight:600;font-size:14.5px;word-break:break-all;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.frow .fn .asset{font-size:11px;color:var(--fg-subtle);font-weight:400}
.frow .fnote{font-size:12.5px;color:var(--fg-muted);margin-top:3px}
.frow .fs{font-size:12.5px;color:var(--fg-muted);margin-top:3px;display:flex;gap:12px;flex-wrap:wrap}
.dl-btn{
  background:var(--accent);color:#fff;border:1px solid var(--accent);
  padding:9px 16px;border-radius:8px;font-size:13.5px;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex-shrink:0;
  transition:background .15s;
}
.dl-btn:hover{background:var(--accent-hover)}
.dl-btn svg{width:14px;height:14px;fill:currentColor}
.ftype{
  font-size:10.5px;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--fg-muted);
  border:1px solid var(--border);flex-shrink:0;font-weight:500;
}

/* giscus */
.giscus-wrap{margin-top:6px}
.giscus{min-height:120px}

/* ---------- admin modal ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(31,35,40,.45);z-index:100;
  display:grid;place-items:center;padding:20px;backdrop-filter:blur(3px);
}
.modal{
  background:var(--bg);border:1px solid var(--border);border-radius:14px;
  width:100%;max-width:640px;max-height:88vh;overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,.3);
}
.modal-hd{padding:18px 22px;border-bottom:1px solid var(--border-soft);display:flex;align-items:center;position:sticky;top:0;background:var(--bg);z-index:2;border-radius:14px 14px 0 0}
.modal-hd .mt{font-size:16px;font-weight:650}
.modal-hd .x{margin-left:auto;background:none;border:0;color:var(--fg-muted);cursor:pointer;padding:4px;display:grid;place-items:center;border-radius:6px}
.modal-hd .x:hover{background:var(--chip);color:var(--fg)}
.modal-hd .x svg{width:18px;height:18px;fill:currentColor}
.modal-bd{padding:22px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.field label .req{color:var(--danger)}
.field input[type=text],.field input[type=password],.field input[type=url],.field textarea,.field select{
  width:100%;padding:9px 12px;font-size:14px;font-family:inherit;
  background:var(--input);color:var(--fg);border:1px solid var(--border);border-radius:8px;outline:none;
  transition:border-color .15s,box-shadow .15s;
}
.field textarea{min-height:110px;resize:vertical;line-height:1.6}
.field input:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field .hint{font-size:12px;color:var(--fg-subtle);margin-top:5px;line-height:1.5}
.field .hint a{color:var(--accent)}
.frow2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.filepick{
  border:1.5px dashed var(--border);border-radius:10px;padding:18px;text-align:center;cursor:pointer;
  color:var(--fg-muted);font-size:13.5px;transition:border-color .15s,background .15s;
}
.filepick:hover{border-color:var(--accent);background:var(--accent-soft)}
.upl-item{border:1px solid var(--border);border-radius:9px;padding:12px;margin-top:10px;background:var(--card)}
.upl-item .un{font-weight:600;font-size:13.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.upl-item .un .sz{color:var(--fg-subtle);font-weight:400;font-size:12px}
.upl-item input[type=text]{margin-top:8px}
.progress{height:6px;border-radius:999px;background:var(--chip);margin-top:10px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:999px;width:0;transition:width .2s}
.plog{font-size:12.5px;color:var(--fg-muted);margin-top:14px;line-height:1.8;min-height:20px}
.plog .ok{color:var(--ok)}.plog .err{color:var(--danger)}
.mlist .mrow{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--border-soft)}
.mlist .mrow:first-child{border-top:0}
.mlist .mn{font-weight:600;font-size:14px;flex:1;min-width:0}
.mlist .mn small{display:block;color:var(--fg-subtle);font-weight:400;font-size:12px}
.tag-off{font-size:11px;color:var(--warn);background:var(--warn-soft);padding:1px 8px;border-radius:999px}
.btn-row{display:flex;gap:10px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
.notice{font-size:13px;padding:12px 14px;border-radius:9px;line-height:1.7;margin-bottom:18px}
.notice.info{background:var(--accent-soft);color:var(--accent)}
.notice.warn{background:var(--warn-soft);color:var(--warn)}
.notice.ok{background:var(--ok-soft);color:var(--ok)}

/* toast */
.toast{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(90px);
  background:var(--fg);color:var(--bg);padding:11px 20px;border-radius:9px;font-size:13.5px;font-weight:500;
  opacity:0;transition:all .32s cubic-bezier(.2,.7,.3,1);z-index:999;pointer-events:none;
  box-shadow:0 10px 28px rgba(0,0,0,.22);max-width:90vw;
}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

footer{border-top:1px solid var(--border-soft);padding:26px 0;color:var(--fg-subtle);font-size:12.5px}
.ft-inner{max-width:1080px;margin:0 auto;padding:0 24px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
footer a{color:var(--accent)}

@media (max-width:640px){
  .wrap,.hd-inner,.tb-inner,.ft-inner{padding-left:18px;padding-right:18px}
  .hero{padding:32px 0 22px}
  .hero h1{font-size:25px}
  .grid{grid-template-columns:1fr}
  .frow2{grid-template-columns:1fr}
  .frow{flex-wrap:wrap}
  .d-head{flex-wrap:wrap}
}
</style>
</head>
<body>

<header>
  <div class="hd-inner">
    <div class="brand" id="brand" title="返回首页">
      <svg viewBox="0 0 32 32"><rect x="4" y="10" width="24" height="16" rx="3" fill="#0969da"/><path d="M4 12l12-8 12 8-12 7z" fill="#0969da" opacity=".55"/><path d="M16 19l12-7v3l-12 7-12-7v-3z" fill="#fff" opacity=".35"/></svg>
      <div class="t" id="siteTitle">产品发布中心<small id="siteOwner"></small></div>
    </div>
    <div class="hd-actions">
      <button class="ibtn" id="themeBtn" title="切换主题" aria-label="切换主题">
        <svg class="ico-moon" viewBox="0 0 16 16"><path d="M9.598 1.591a.75.75 0 0 1 .785-.175 7 7 0 1 1-8.967 8.967.75.75 0 0 1 .961-.96 5.5 5.5 0 0 0 7.046-7.046.75.75 0 0 1 .175-.786Zm1.616 1.945a7 7 0 0 1-7.678 7.678 5.5 5.5 0 1 0 7.678-7.678Z"/></svg>
        <svg class="ico-sun" viewBox="0 0 16 16"><path d="M8 12a4 4 0 1 1 0-8 4 4 0 0 1 0 8Zm0-1.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Zm5.657-8.157a.75.75 0 0 1 0 1.061l-1.061 1.06a.75.75 0 1 1-1.06-1.06l1.06-1.06a.75.75 0 0 1 1.06 0Zm-9.193 9.193a.75.75 0 0 1 0 1.06l-1.06 1.061a.75.75 0 1 1-1.061-1.06l1.06-1.061a.75.75 0 0 1 1.061 0ZM8 0a.75.75 0 0 1 .75.75v1.5a.75.75 0 0 1-1.5 0V.75A.75.75 0 0 1 8 0ZM3 8a.75.75 0 0 1-.75.75H.75a.75.75 0 0 1 0-1.5h1.5A.75.75 0 0 1 3 8Zm13 0a.75.75 0 0 1-.75.75h-1.5a.75.75 0 0 1 0-1.5h1.5A.75.75 0 0 1 16 8ZM8 13a.75.75 0 0 1 .75.75v1.5a.75.75 0 0 1-1.5 0v-1.5A.75.75 0 0 1 8 13ZM2.343 2.343a.75.75 0 0 1 1.061 0l1.06 1.061a.75.75 0 0 1-1.06 1.06l-1.06-1.06a.75.75 0 0 1 0-1.06Zm9.193 9.193a.75.75 0 0 1 1.06 0l1.061 1.06a.75.75 0 0 1-1.06 1.061l-1.061-1.06a.75.75 0 0 1 0-1.061Z"/></svg>
      </button>
      <button class="ibtn" id="adminBtn">
        <svg viewBox="0 0 16 16"><path d="M8 0a8 8 0 1 1 0 16A8 8 0 0 1 8 0ZM6.379 10.227a2.624 2.624 0 0 0 3.242 0c.13-.096.274-.17.428-.219l.727-.243a1.5 1.5 0 0 0 1.024-1.423v-.86a.75.75 0 0 0-.75-.75h-.5V6.5a3 3 0 0 0-3-3h-.5a3 3 0 0 0-3 3v1.25h-.5a.75.75 0 0 0-.75.75v.86a1.5 1.5 0 0 0 1.024 1.423l.727.243c.154.05.298.123.428.219ZM7.5 6.5h1a.75.75 0 0 1 0 1.5h-1a.75.75 0 0 1 0-1.5Z"/></svg>
        管理
      </button>
    </div>
  </div>
</header>

<div class="toolbar hidden" id="toolbar">
  <div class="tb-inner">
    <div class="search">
      <svg viewBox="0 0 16 16"><path d="M10.68 11.74a6 6 0 0 1-7.922-8.982 6 6 0 0 1 8.982 7.922l3.04 3.04a.749.749 0 0 1-.326 1.275.749.749 0 0 1-.734-.215ZM11.5 7a4.499 4.499 0 1 0-8.997 0A4.499 4.499 0 0 0 11.5 7Z"/></svg>
      <input id="q" type="search" placeholder="搜索产品…" autocomplete="off">
    </div>
    <select id="sort">
      <option value="date">最新发布</option>
      <option value="downloads">下载最多</option>
      <option value="name">名称 A→Z</option>
    </select>
  </div>
</div>

<main>
  <!-- 列表视图 -->
  <div id="listView">
    <div class="wrap">
      <div class="hero">
        <h1 id="heroTitle">开发产品</h1>
        <div class="sub" id="heroSub"></div>
        <div class="stats">
          <div class="stat"><b id="s-products">0</b> 个产品</div>
          <div class="stat"><b id="s-files">0</b> 个文件</div>
          <div class="stat"><b id="s-downloads">—</b> 次下载</div>
        </div>
      </div>
    </div>
    <div class="wrap">
      <div class="grid" id="grid"></div>
      <div class="empty hidden" id="emptyBox">
        <svg viewBox="0 0 16 16"><path d="M1.75 1.5a.25.25 0 0 0-.25.25v12.5c0 .138.112.25.25.25h12.5a.25.25 0 0 0 .25-.25V1.75a.25.25 0 0 0-.25-.25ZM1.75 0h12.5C15.216 0 16 .784 16 1.75v12.5A1.75 1.75 0 0 1 14.25 16H1.75A1.75 1.75 0 0 1 0 14.25V1.75C0 .784.784 0 1.75 0Zm9.75 5.25a.75.75 0 0 1-.75.75H5.25a.75.75 0 0 1 0-1.5h5.5a.75.75 0 0 1 .75.75Zm0 4a.75.75 0 0 1-.75.75H5.25a.75.75 0 0 1 0-1.5h5.5a.75.75 0 0 1 .75.75Z"/></svg>
        <div id="emptyText">还没有产品</div>
      </div>
    </div>
  </div>

  <!-- 详情视图 -->
  <div id="detailView" class="hidden">
    <div class="wrap detail">
      <div class="back" id="backBtn">
        <svg viewBox="0 0 16 16"><path d="M9.78 12.78a.75.75 0 0 1-1.06 0L4.47 9.53a.75.75 0 0 1 0-1.06l4.25-4.25a.751.751 0 0 1 1.06.02.751.751 0 0 1 .02 1.06L6.06 9l3.72 3.72a.75.75 0 0 1 0 1.06Z"/></svg>
        返回产品列表
      </div>
      <div id="dHead"></div>

      <div class="section">

<script>
/* ================= 配置 ================= */
const OWNER  = "dhwgithub";
const REPO   = "dhwgithub.github.io";
const REPO_FULL = OWNER + "/" + REPO;
const DATA_PATH = "data/products.json";
const GISCUS = {
  repo: REPO_FULL,
  repoId: "R_kgDOVTP2CA",
  category: "Announcements",
  categoryId: "DIC_kwDOVTP2CM4DJUeM"
};

/* ================= 工具 ================= */
const $ = s => document.querySelector(s);
const esc = s => (s == null ? "" : String(s)).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtSize = n => {
  if (n == null) return "—";
  if (n < 1024) return n + " B";
  if (n < 1048576) return (n/1024).toFixed(1) + " KB";
  if (n < 1073741824) return (n/1048576).toFixed(1) + " MB";
  return (n/1073741824).toFixed(2) + " GB";
};
const fmtDate = d => d ? d.replace(/-/g, ".") : "—";
const slugId = () => "prod-" + Date.now().toString(36);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const toast = (msg, ms) => {
  const t = $("#toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("show"), ms || 2600);
};
const b64 = str => {
  const bytes = new TextEncoder().encode(str);
  let bin = ""; const CH = 0x8000;
  for (let i = 0; i < bytes.length; i += CH) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
  return btoa(bin);
};
const LOGO_COLORS = ["#0969da","#8250df","#bf3989","#d1242f","#bc4c00","#1a7f37","#0550ae","#57606a"];
const logoColor = id => LOGO_COLORS[(id || "x").split("").reduce((a,c) => a + c.charCodeAt(0), 0) % LOGO_COLORS.length];
const linkify = s => esc(s).replace(/(https?:\/\/[^\s<>"']+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');

/* ================= 状态 ================= */
let DATA = null;           // products.json 内容
let dlMap = null;          // tag -> { assetName: count }
let dlTime = 0;
let dlPending = false;
const state = { q: "", sort: "date", token: localStorage.getItem("prod-admin-token") || "", me: null };

/* ================= GitHub API ================= */
async function gh(method, path, body, auth) {
  const tok = auth !== undefined ? auth : state.token;
  const res = await fetch("https://api.github.com" + path, {
    method,
    headers: {
      "Accept": "application/vnd.github+json",
      "X-GitHub-Api-Version": "2022-11-28",
      ...(tok ? {"Authorization": "Bearer " + tok} : {}),
      ...(body ? {"Content-Type": "application/json"} : {})
    },
    body: body ? JSON.stringify(body) : undefined
  });
  if (res.status === 204) return {};
  const j = await res.json().catch(() => ({}));
  if (!res.ok) {
    const extra = j.errors ? " " + (j.errors.map(e => e.message || e.code).join("; ")) : "";
    throw new Error((j.message || ("HTTP " + res.status)) + extra);
  }
  return j;
}

function uploadAsset(releaseId, file, onprog) {
  return new Promise((resolve, reject) => {
    const assetName = safeAssetName(file.name);
    const xhr = new XMLHttpRequest();
    xhr.open("POST", "https://uploads.github.com/repos/" + REPO_FULL + "/releases/" + releaseId +
             "/assets?name=" + encodeURIComponent(assetName));
    xhr.setRequestHeader("Authorization", "Bearer " + state.token);
    xhr.setRequestHeader("Content-Type", "application/octet-stream");
    xhr.upload.onprogress = e => { if (e.lengthComputable && onprog) onprog(e.loaded / e.total); };
    xhr.onload = () => {
      if (xhr.status >= 200 && xhr.status < 300) {
        try { resolve(JSON.parse(xhr.responseText)); } catch (e) { reject(new Error("响应解析失败")); }
      } else {
        let msg = "HTTP " + xhr.status;
        try { msg = JSON.parse(xhr.responseText).message || msg; } catch (e) {}
        reject(new Error("上传失败：" + msg));
      }
    };
    xhr.onerror = () => reject(new Error("网络错误"));
    xhr.send(file);
  });
}

/* GitHub Release 资产只接受 ASCII 文件名 */
function safeAssetName(name) {
  const dot = name.lastIndexOf(".");
  const ext = dot > 0 ? name.slice(dot).toLowerCase() : "";
  const base = (dot > 0 ? name.slice(0, dot) : name).replace(/[^\w\-]+/g, "");
  if (base.length >= 2) return base + ext;
  return "file-" + Date.now().toString(36) + ext;
}

/* ================= 数据加载 ================= */
async function loadData() {
  try {
    const res = await fetch(DATA_PATH + "?t=" + Date.now(), {cache: "no-store"});
    if (!res.ok) throw new Error();
    DATA = await res.json();
  } catch (e) {
    DATA = {site: {title: "产品发布中心", owner: OWNER}, products: []};
  }
}

async function fetchDl(force) {
  if (dlPending) return;
  if (!force && dlMap && Date.now() - dlTime < 5 * 60 * 1000) return;
  dlPending = true;
  try {
    const rels = await gh("GET", "/repos/" + REPO_FULL + "/releases?per_page=100", null, "");
    dlMap = {};
    rels.forEach(r => {
      dlMap[r.tag_name] = {};
      (r.assets || []).forEach(a => { dlMap[r.tag_name][a.name] = a.download_count || 0; });
    });
    dlTime = Date.now();
  } catch (e) { /* 下载计数获取失败时静默降级 */ }
  dlPending = false;
}
const dlOf = (p, f) => (dlMap && dlMap[p.tag] && dlMap[p.tag][f.asset]) || 0;
const dlTotal = p => (p.files || []).reduce((a, f) => a + dlOf(p, f), 0);

/* ================= 路由 ================= */
function route() {
  const m = location.hash.match(/^#\/p\/([\w\-]+)/);
  if (m) {
    const p = DATA.products.find(x => x.id === m[1] && !x.hidden);
    if (p) return showDetail(p);
  }
  showList();
}

/* ================= 列表视图 ================= */
function visibleProducts() {
  return DATA.products.filter(p => !p.hidden);
}

function renderList() {
  let list = visibleProducts();
  const q = state.q.toLowerCase();
  if (q) list = list.filter(p =>
    (p.name || "").toLowerCase().includes(q) ||
    (p.tagline || "").toLowerCase().includes(q));
  const cmp = {
    date:      (a, b) => (b.date || "").localeCompare(a.date || ""),
    downloads: (a, b) => dlTotal(b) - dlTotal(a),
    name:      (a, b) => (a.name || "").localeCompare(b.name || "")
  }[state.sort];
  list.sort(cmp);

  const grid = $("#grid");
  grid.innerHTML = list.map(p => `
    <div class="pcard" data-id="${esc(p.id)}" tabindex="0" role="link" aria-label="${esc(p.name)}">
      <div class="pc-head">
        <div class="pc-logo" style="background:${logoColor(p.id)}">${esc((p.name || "?").trim().charAt(0).toUpperCase())}</div>
        <div style="flex:1;min-width:0">
          <div class="pc-title">${esc(p.name)}${p.version ? '<span class="pc-ver">v' + esc(p.version) + "</span>" : ""}</div>
          <div class="pc-tag">${esc(p.tagline || "")}</div>
        </div>
      </div>
      <div class="pc-meta">
        <span><svg viewBox="0 0 16 16"><path d="M4.75 1a.75.75 0 0 1 .75.75V3h5.5V1.75a.75.75 0 0 1 1.5 0V3h1.25c.966 0 1.75.784 1.75 1.75v8.5A1.75 1.75 0 0 1 13.75 15H3.25A1.75 1.75 0 0 1 1.5 13.25v-8.5C1.5 3.784 2.284 3 3.25 3H4V1.75A.75.75 0 0 1 4.75 1Z"/></svg>${fmtDate(p.date)}</span>
        <span><svg viewBox="0 0 16 16"><path d="M2 1.75C2 .784 2.784 0 3.75 0h8.5C13.216 0 14 .784 14 1.75v12.5A1.75 1.75 0 0 1 12.25 16h-8.5A1.75 1.75 0 0 1 2 14.25Zm9.5 3.25a.75.75 0 0 1-.75.75h-6.5a.75.75 0 0 1 0-1.5h6.5a.75.75 0 0 1 .75.75Zm0 4a.75.75 0 0 1-.75.75h-6.5a.75.75 0 0 1 0-1.5h6.5a.75.75 0 0 1 .75.75Z"/></svg>${(p.files || []).length} 个文件</span>
        <span><svg viewBox="0 0 16 16"><path d="M1.5 3.25a2.25 2.25 0 0 1 2.25-2.25h8.5a2.25 2.25 0 0 1 2.25 2.25v9a2.75 2.75 0 0 1-2.75 2.75H3a1.75 1.75 0 0 1-1.5-2.65Zm10.25-.75a.75.75 0 0 0-.75.75v8.75a1.25 1.25 0 0 0 2.5 0V3.25a.75.75 0 0 0-.75-.75Z"/></svg>${fmtSize((p.files || []).reduce((a, f) => a + (f.size || 0), 0))}</span>
        <span><svg viewBox="0 0 16 16"><path d="M1.5 8a6.5 6.5 0 1 1 11.4 4.24l1.4 1.4a.75.75 0 0 1-1.06 1.06l-1.4-1.4A6.5 6.5 0 0 1 1.5 8Zm6.5-5a5 5 0 1 0 0 10A5 5 0 0 0 8 3Z"/></svg><span data-dl="${esc(p.id)}">…</span> 次下载</span>
      </div>
      <span class="pc-go">查看详情<svg viewBox="0 0 16 16"><path d="M6.22 3.22a.75.75 0 0 1 1.06 0l4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.751.751 0 0 1-1.06-1.06L9.94 8 6.22 4.28a.75.75 0 0 1 0-1.06Z"/></svg></span>
    </div>`).join("");

  const vis = visibleProducts();
  $("#s-products").textContent = vis.length;
  $("#s-files").textContent = vis.reduce((a, p) => a + (p.files || []).length, 0);
  $("#emptyBox").classList.toggle("hidden", list.length > 0);
  $("#emptyText").textContent = vis.length === 0
    ? "还没有产品发布——管理员可点右上角「管理」发布第一个产品"
    : "没有匹配的产品，换个关键词试试";
  fillDl(list);
  fetchDl().then(() => fillDl(list));
}

function fillDl(list) {
  const total = list.reduce((a, p) => a + dlTotal(p), 0);
  const s = $("#s-downloads");
  if (s) s.textContent = dlMap ? String(total) : "—";
  document.querySelectorAll("[data-dl]").forEach(el => {
    const p = DATA.products.find(x => x.id === el.dataset.dl);
    if (p) el.textContent = String(dlTotal(p));
  });
}

function showList() {
  $("#detailView").classList.add("hidden");
  $("#listView").classList.remove("hidden");
  $("#toolbar").classList.remove("hidden");
  $("#giscusBox").innerHTML = "";
  document.title = (DATA.site && DATA.site.title) || "产品发布中心";
  renderList();
}

/* ================= 详情视图 ================= */
function fileBadge(name) {
  const ext = (name.split(".").pop() || "").toLowerCase();
  if (["exe", "msi", "msix", "appx", "dmg", "pkg", "apk", "deb", "rpm"].includes(ext)) return "安装包";
  if (["zip", "7z", "rar", "tar", "gz", "bz2", "xz"].includes(ext)) return "压缩包";
  if (["txt", "md", "pdf", "doc", "docx"].includes(ext)) return "说明文档";
  return ext.toUpperCase() || "文件";
}

  $("#listView").classList.add("hidden");

  $("#detailView").classList.remove("hidden");

    links.push('<a class="ibtn" href="' + esc(p.links.repo) + '" target="_blank" rel="noopener"><svg viewBox="0 0 16 16"><path d="M8 0a8 8 0 0 0-2.53 15.59c.4.07.55-.17.55-.38v-1.34c-2.22.48-2.69-1.07-2.69-1.07-.36-.93-.89-1.18-.89-1.18-.73-.5.05-.49.05-.49.81.06 1.23.83 1.23.83.72 1.24 1.88.88 2.34.67.07-.52.28-.88.51-1.08-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.83-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.03 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.52.56.83 1.28.83 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48v2.2c0 .21.14.46.55.38A8 8 0 0 0 8 0Z"/></svg>源码仓库</a>');
  if (p.links && p.links.homepage)
    links.push('<a class="ibtn" href="' + esc(p.links.homepage) + '" target="_blank" rel="noopener"><svg viewBox="0 0 16 16"><path d="M7.775 3.525a.75.75 0 0 0 1.06 1.06l1.25-1.25a2 2 0 1 1 2.83 2.83l-2.5 2.5a2 2 0 0 1-2.83 0 .75.75 0 0 0-1.06 1.06 3.5 3.5 0 0 0 4.95 0l2.5-2.5a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25Zm-4.69 9.64a2 2 0 0 1 0-2.83l2.5-2.5a2 2 0 0 1 2.83 0 .75.75 0 0 0 1.06-1.06 3.5 3.5 0 0 0-4.95 0l-2.5 2.5a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25a.75.75 0 0 0-1.06-1.06l-1.25 1.25a2 2 0 0 1-2.83 0Z"/></svg>项目主页</a>');

  $("#dHead").innerHTML = `
    <div class="d-head">
      <div class="d-logo" style="background:${logoColor(p.id)}">${esc((p.name || "?").trim().charAt(0).toUpperCase())}</div>
      <div style="flex:1;min-width:0">
        <div class="d-title">${esc(p.name)}${p.version ? ' <span class="pc-ver" style="font-size:13px">v' + esc(p.version) + "</span>" : ""}</div>
        <div class="d-sub">${esc(p.tagline || "")}</div>
        <div class="d-meta">
          <span><svg viewBox="0 0 16 16"><path d="M4.75 1a.75.75 0 0 1 .75.75V3h5.5V1.75a.75.75 0 0 1 1.5 0V3h1.25c.966 0 1.75.784 1.75 1.75v8.5A1.75 1.75 0 0 1 13.75 15H3.25A1.75 1.75 0 0 1 1.5 13.25v-8.5C1.5 3.784 2.284 3 3.25 3H4V1.75A.75.75 0 0 1 4.75 1Z"/></svg>发布于 ${fmtDate(p.date)}</span>
          <span><svg viewBox="0 0 16 16"><path d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.751.751 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z"/></svg><span id="dTotalDl">…</span> 次下载</span>
          <span><svg viewBox="0 0 16 16"><path d="M2 1.75C2 .784 2.784 0 3.75 0h8.5C13.216 0 14 .784 14 1.75v12.5A1.75 1.75 0 0 1 12.25 16h-8.5A1.75 1.75 0 0 1 2 14.25Z"/></svg>${(p.files || []).length} 个文件 · ${fmtSize((p.files || []).reduce((a, f) => a + (f.size || 0), 0))}</span>

}

/* ================= giscus ================= */
function injectGiscus() {
  const box = $("#giscusBox");
  box.innerHTML = "";
  const s = document.createElement("script");
  s.src = "https://giscus.app/client.js";
  s.setAttribute("data-repo", GISCUS.repo);
  s.setAttribute("data-repo-id", GISCUS.repoId);
  s.setAttribute("data-category", GISCUS.category);
  s.setAttribute("data-category-id", GISCUS.categoryId);
  s.setAttribute("data-mapping", "title");
  s.setAttribute("data-strict", "1");
  s.setAttribute("data-reactions-enabled", "1");
  s.setAttribute("data-emit-metadata", "0");
  s.setAttribute("data-input-position", "top");
  s.setAttribute("data-theme", document.documentElement.dataset.theme === "dark" ? "dark" : "light");
  s.setAttribute("data-lang", "zh-CN");
  s.setAttribute("data-loading", "lazy");
  s.crossOrigin = "anonymous";
  s.async = true;
  box.appendChild(s);
}
function syncGiscusTheme() {
  const iframe = document.querySelector("iframe.giscus");
  if (!iframe) return;
  iframe.contentWindow.postMessage(
    {giscus: {setConfig: {theme: document.documentElement.dataset.theme === "dark" ? "dark" : "light"}}},
    "https://giscus.app");
}

/* ================= 主题 ================= */
function initTheme() {
  const saved = localStorage.getItem("prod-theme");
  document.documentElement.dataset.theme = saved ||
    (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
}
$("#themeBtn").onclick = () => {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  localStorage.setItem("prod-theme", next);
  syncGiscusTheme();
};

function adminHTML() {
  return `

async function verifyToken(silent) {
  try {
    const me = await gh("GET", "/user");
    if (me.login !== OWNER) {
      state.token = ""; state.me = null;
      localStorage.removeItem("prod-admin-token");
      throw new Error("此 token 属于账号 " + me.login + "，只有 " + OWNER + " 可以管理本站");
    }
    state.me = me;
    localStorage.setItem("prod-admin-token", state.token);
    renderAdminBody();
  } catch (e) {
    if (!silent) toast("登录失败：" + e.message, 4000);
    if (String(e.message).includes("Bad credentials")) {
      state.token = ""; localStorage.removeItem("prod-admin-token");
    }
    if (!state.me) renderAdminBody();
  }
}

/* 浏览器直传（带重试）——受网络影响可能失败，失败后走网页上传兜底 */
async function uploadWithRetry(releaseId, file, onprog, logFn) {
  let lastErr = null;
  for (let a = 1; a <= 3; a++) {
    try {
      return await uploadAsset(releaseId, file, onprog);
    } catch (e) {
      lastErr = e;
      if (a < 3) { logFn("网络波动，第 " + (a + 1) + " 次尝试…"); await sleep(2500 * a); }
    }
  }
  throw lastErr;
}

/* 网页上传兜底面板：Release 已建好，引导用户去 GitHub 官方网页拖文件，回来点按钮扫描完成 */
function manualPanel(container, tag, onAssets) {
  const editUrl = "https://github.com/" + REPO_FULL + "/releases/edit/" + encodeURIComponent(tag);
  container.innerHTML =
    '<div class="notice warn">' +
    '<b>浏览器直传失败</b>——GitHub 的文件上传接口（uploads.github.com）不允许站点跨域直连，受网络环境影响较大。<br>' +
    'Release 已经创建好，改用 GitHub 官方网页上传即可，全程约一分钟：<br>' +
    '① 点 <a href="' + editUrl + '" target="_blank" rel="noopener"><b>打开 Release 编辑页</b></a>（新标签页）<br>' +
    '② 把安装包 / 说明文件拖到「Attach binaries」虚线框里，等上传进度条走完<br>' +
    '③ 回到本页，点下面按钮完成发布' +
    '</div>' +
    '<div class="btn-row"><button class="ibtn primary" id="mScanBtn">我已传完，完成发布</button></div>';
  container.querySelector("#mScanBtn").onclick = async () => {
    const btn = container.querySelector("#mScanBtn");
    btn.disabled = true; btn.textContent = "扫描中…";
    try {
      const rel = await gh("GET", "/repos/" + REPO_FULL + "/releases/tags/" + encodeURIComponent(tag));
      if (!rel.assets || !rel.assets.length) {
        btn.disabled = false; btn.textContent = "我已传完，完成发布";
        return toast("该 Release 下还没有文件，请先在 GitHub 网页完成上传");
      }
      await onAssets(rel.assets);
    } catch (e) {
      btn.disabled = false; btn.textContent = "我已传完，完成发布";
      toast("扫描失败：" + e.message, 3600);
    }
  };
}

async function doPublish() {
  const name = $("#fName").value.trim();
  const version = $("#fVer").value.trim();
  const tagline = $("#fTag").value.trim();
  const desc = $("#fDesc").value.trim();
  const repo = $("#fRepo").value.trim();
  const home = $("#fHome").value.trim();
  if (!name || !version) return toast("产品名称和版本号为必填");
  if (!pickedFiles.length) return toast("请至少选择一个文件");

  const btn = $("#fGo");
  btn.disabled = true; btn.textContent = "发布中…";
  $("#fLog").innerHTML = "";

  const id = slugId();
  const tag = id + "-v" + version.replace(/[^\w.\-]/g, "");

  let rel;
  try {
    log("1/3 创建 GitHub Release（tag：<b>" + esc(tag) + "</b>）…");
    rel = await gh("POST", "/repos/" + REPO_FULL + "/releases", {
      tag_name: tag,
      name: name + " v" + version,
      body: desc || tagline || name
    });
  } catch (e) {
    log('<span class="err">创建 Release 失败：' + esc(e.message) + "</span>");
    toast("发布失败：" + e.message, 4200);
    btn.disabled = false; btn.textContent = "发布产品";
    return;
  }

  const prod = {
    id, name, tagline, desc, version,
    date: new Date().toISOString().slice(0, 10),
    tag,
    links: {repo, homepage: home},
    files: [], hidden: false
  };
  const finish = async files => {
    log("3/3 更新站点数据…");
    prod.files = files;
    await commitData(d => { d.products.unshift(prod); return d; }, "发布产品：" + name + " v" + version);
    DATA.products.unshift(prod);
    pickedFiles = [];
    closeAdmin();
    toast("发布成功！GitHub Pages 刷新约需 1 分钟，已为你本地预览", 4200);
    route();
  };

  const files = [];
  try {
    for (let i = 0; i < pickedFiles.length; i++) {
      const u = pickedFiles[i];
      log("2/3 上传文件 <b>" + esc(u.file.name) + "</b>（" + (i + 1) + "/" + pickedFiles.length + "）…");
      const item = $("#fUpList").querySelectorAll(".upl-item")[i];
      const bar = item ? item.querySelector(".progress i") : null;
      const asset = await uploadWithRetry(rel.id, u.file,
        p => { if (bar) bar.style.width = Math.round(p * 100) + "%"; },
        m => log(m));
      files.push({
        name: u.file.name,
        asset: asset.name,
        size: asset.size,
        url: asset.browser_download_url,
        note: u.note.trim()
      });
    }
    await finish(files);
  } catch (e) {
    log('<span class="err">浏览器直传失败：' + esc(e.message) + "</span>");
    const panel = document.createElement("div");
    panel.style.marginTop = "14px";
    $("#fLog").insertAdjacentElement("afterend", panel);
    manualPanel(panel, tag, async assets => {
      await finish(assets.map(a => ({name: a.name, asset: a.name, size: a.size, url: a.browser_download_url, note: ""})));
    });
    toast("已切换为网页上传模式，按黄色提示框操作即可", 4200);
    btn.disabled = false; btn.textContent = "发布产品";
  }
}

/* ---------- 数据提交 ---------- */
async function commitData(mutate, message) {
  const cur = await gh("GET", "/repos/" + REPO_FULL + "/contents/" + DATA_PATH + "?ref=main");
  const parsed = JSON.parse(atob(cur.content.replace(/\n/g, "")));
  const updated = mutate(parsed);
  const body = {
    message,
    content: b64(JSON.stringify(updated, null, 1)),
    sha: cur.sha,
    branch: "main"
  };
  await gh("PUT", "/repos/" + REPO_FULL + "/contents/" + DATA_PATH, body);
  return updated;
}

function renderManageList() {
  const el = $("#mList");
  el.innerHTML = DATA.products.map(p => `

      <button class="ibtn danger" data-del="${esc(p.id)}" style="height:30px;padding:0 10px;font-size:12.5px">删除</button>
    </div>`).join("");

  el.querySelectorAll("[data-hide]").forEach(b => b.onclick = async () => {
    const p = DATA.products.find(x => x.id === b.dataset.hide);
    try {
      await commitData(d => {
        const t = d.products.find(x => x.id === p.id); t.hidden = !t.hidden;
        return d;
      }, (p.hidden ? "上架：" : "下架：") + p.name);
      p.hidden = !p.hidden;
      toast("已" + (p.hidden ? "下架" : "上架") + "，线上约 1 分钟后生效");
      renderManageList(); route();
    } catch (e) { toast("操作失败：" + e.message, 3600); }
  });

  el.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    const p = DATA.products.find(x => x.id === b.dataset.del);
    if (!confirm('确定删除「' + p.name + "」？\n\n将同时删除其 GitHub Release（下载文件）与站点数据，评论讨论保留。")) return;
    b.disabled = true;
    try {
      try {
        const rel = await gh("GET", "/repos/" + REPO_FULL + "/releases/tags/" + encodeURIComponent(p.tag));
        if (rel.id) await gh("DELETE", "/repos/" + REPO_FULL + "/releases/" + rel.id);
      } catch (e) { /* release 可能已不存在 */ }
      await commitData(d => {
        d.products = d.products.filter(x => x.id !== p.id);
        return d;
      }, "删除产品：" + p.name);
      DATA.products = DATA.products.filter(x => x.id !== p.id);
      toast("已删除，线上约 1 分钟后生效");
      renderManageList(); route();
    } catch (e) {
      b.disabled = false;
      toast("删除失败：" + e.message, 3600);
    }
  });

  el.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => openEdit(b.dataset.edit));
}

        links: {repo: $("#eRepo").value.trim(), homepage: $("#eHome").value.trim()}});

    }, "更新产品：" + name);

        route();
      }

      logs('<span class="err">失败：' + esc(e.message) + "</span>");
      toast("保存失败：" + e.message, 3600);
      btn.disabled = false; btn.textContent = "保存";

  if (state.token) verifyToken(true).catch(() => {});
  fetchDl().catch(() => {});
  route();
})();
